{% macro stat_tile(label, x_text_expr, icon="activity", gradient="from-indigo-600 to-blue-600", value_class="text-gray-900 dark:text-white") %}
<div class="bg-white dark:bg-slate-900 rounded-2xl border border-gray-200 dark:border-slate-800 shadow-sm p-5 transition-all duration-300">
	<div class="flex items-center gap-3 mb-4">
		<div class="w-11 h-11 rounded-xl bg-gradient-to-br {{ gradient }} flex items-center justify-center flex-shrink-0 shadow-lg">
			<i data-lucide="{{ icon }}" class="w-5 h-5 text-white"></i>
		</div>
		<div class="text-xl font-bold {{ value_class }} tracking-tight" x-text="{{ x_text_expr }}"></div>
	</div>
	<div class="flex items-center justify-between pt-3 border-t border-gray-100 dark:border-slate-800">
		<span class="text-xs font-bold text-gray-400 dark:text-slate-500 uppercase tracking-widest">{{ label }}</span>
	</div>
</div>
{% endmacro %}

{% macro panel(title) %}
<section class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 mb-5">
	{% if title %}<h3 class="font-semibold mb-3 text-slate-900 dark:text-slate-100">{{ title }}</h3>{% endif %}
	{{ caller() }}
</section>
{% endmacro %}
