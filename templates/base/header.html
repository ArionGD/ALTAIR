<header class="fixed top-0 z-[999] w-full border-b border-gray-100 dark:border-white/5 bg-white/90 dark:bg-black shadow-2xl backdrop-blur-md">
	<div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-black/10 dark:via-white/20 to-transparent opacity-50"></div>
	<div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between font-bold">
		<!-- Identity -->
		<a href="/" class="flex items-center gap-4 no-underline group flex-1">
			<div class="w-11 h-11 rounded-full border border-gray-200 dark:border-white/10 overflow-hidden shadow-2xl p-0.5 bg-white group-hover:scale-110 transition-transform duration-700">
				<img src="/static/image/altair.jpg" alt="ALTAIR" class="w-full h-full object-contain rounded-full" />
			</div>
			<span class="text-xl font-black text-gray-900 dark:text-white tracking-[0.3em] uppercase transition-all duration-700 font-syncopate">Altair</span>
		</a>

		<!-- Navigation -->
		<div class="hidden md:flex items-center justify-center gap-10 flex-1 font-outfit">
			<a href="/" class="text-[11px] font-black text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition-colors uppercase tracking-[0.4em]">Home</a>
			<a href="/features" class="text-[11px] font-black text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition-colors uppercase tracking-[0.4em]">Features</a>
			<a href="/support" class="text-[11px] font-black text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition-colors uppercase tracking-[0.4em]">Support</a>
			<a href="/dashboard" class="text-[11px] font-black text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition-colors uppercase tracking-[0.4em]">Dashboard</a>
		</div>

		<!-- Actions -->
		<nav class="hidden md:flex items-center justify-end flex-1 gap-4">
			<button
				@click="$store.theme.toggle()"
				class="w-10 h-10 rounded-xl border border-gray-200 dark:border-white/10 bg-gray-50 dark:bg-white/5 flex items-center justify-center text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white hover:bg-gray-100 dark:hover:bg-white/10 transition-all duration-300 shadow-sm"
				title="Toggle Theme"
			>
				<i x-show="!$store.theme.dark" data-lucide="sun" class="w-5 h-5 text-amber-500"></i>
				<i x-show="$store.theme.dark" x-cloak data-lucide="moon" class="w-5 h-5 text-blue-400"></i>
			</button>

			<a
				href="/dashboard"
				class="px-8 py-3 rounded-xl bg-blue-600 text-white text-[10px] font-black uppercase tracking-[0.2em] hover:bg-blue-500 transition-all shadow-2xl shadow-blue-500/20 active:scale-95"
			>
				Launch Dashboard
			</a>
		</nav>
	</div>
</header>
