<header class="h-20 shrink-0 border-b border-gray-200 dark:border-slate-800 bg-white dark:bg-slate-900 flex items-center gap-4 px-6 transition-colors duration-300">
	<div class="min-w-0 shrink-0">
		<h1 class="text-[15px] font-black text-gray-900 dark:text-white uppercase tracking-tight truncate" x-text="tabTitle()"></h1>
	</div>

	<div class="hidden lg:flex flex-1 justify-center px-8">
		<div class="relative w-full max-w-sm" x-show="activeTab === 'strikes'">
			<i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400 dark:text-slate-500"></i>
			<input
				type="text"
				x-model="search"
				placeholder="Search ticker..."
				class="w-full bg-gray-100 dark:bg-slate-800 border border-gray-200 dark:border-slate-700 rounded-xl pl-9 pr-4 py-2.5 text-xs text-gray-800 dark:text-white placeholder-gray-400 dark:placeholder-slate-500 outline-none focus:border-indigo-400 transition-colors shadow-sm"
			/>
		</div>
	</div>

	<div class="flex items-center gap-3 shrink-0 ml-auto">
		<label class="text-xs uppercase tracking-wide text-gray-500 dark:text-slate-500 hidden sm:inline" for="market-filter">Market</label>
		<select
			id="market-filter"
			x-model="market"
			@change="loadData()"
			class="bg-gray-100 dark:bg-slate-800 border border-gray-200 dark:border-slate-700 rounded-lg text-sm px-3 py-1.5 text-gray-900 dark:text-white"
		>
			<option value="">All</option>
			<option value="US">US</option>
			<option value="IND">India</option>
		</select>

		<button
			@click="checkHealth(); loadData(); if (activeTab === 'overview') refreshOverviewMarketData();"
			class="w-9 h-9 flex items-center justify-center rounded-lg border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-gray-500 dark:text-slate-400 hover:bg-gray-100 dark:hover:bg-slate-700 transition-colors shadow-sm hidden md:flex"
			title="Refresh — on Overview, also force-rescans today's movers and index charts (otherwise those are cached once per day)"
		>
			<i data-lucide="refresh-cw" class="w-4 h-4"></i>
		</button>

		<button
			@click="runAudit()"
			:disabled="auditStatus.in_progress"
			class="items-center gap-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-lg text-sm px-4 py-2 disabled:opacity-50 disabled:cursor-not-allowed hidden md:inline-flex transition-colors shadow-sm shadow-indigo-500/20"
		>
			<i data-lucide="play" class="w-3.5 h-3.5"></i> Run Full Audit
		</button>

		<span
			class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs border"
			:class="health.online ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-600 dark:text-emerald-300' : 'bg-rose-500/10 border-rose-500/30 text-rose-600 dark:text-rose-300'"
		>
			<span class="w-2 h-2 rounded-full" :class="health.online ? 'bg-emerald-400' : 'bg-rose-400'"></span>
			<span class="hidden lg:inline" x-text="healthLabel()"></span>
		</span>

		<button
			@click="toggleTheme()"
			class="w-9 h-9 flex items-center justify-center rounded-lg border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-gray-500 dark:text-slate-400 hover:bg-gray-100 dark:hover:bg-slate-700 transition-colors shadow-sm"
			:aria-label="isDark ? 'Switch to light mode' : 'Switch to dark mode'"
		>
			<i data-lucide="moon" class="w-4 h-4 text-indigo-400" x-show="isDark"></i>
			<i data-lucide="sun" class="w-4 h-4 text-amber-500" x-show="!isDark" x-cloak></i>
		</button>
	</div>
</header>
