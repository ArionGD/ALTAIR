{% import "bloc/ui.html" as ui %}
<div>
	<style>
		.egb-md-table { width: 100%; border-collapse: collapse; margin: 0.75rem 0; font-size: 0.85rem; }
		.egb-md-table td { border: 1px solid rgba(148, 163, 184, 0.25); padding: 0.4rem 0.6rem; }
		.egb-findings h2 { font-size: 1.05rem; font-weight: 800; margin: 1.25rem 0 0.5rem; }
		.egb-findings h3 { font-size: 0.9rem; font-weight: 700; margin: 1rem 0 0.4rem; }
		.egb-findings p { font-size: 0.85rem; line-height: 1.6; margin: 0.4rem 0; }
		.egb-findings ul { margin: 0.4rem 0 0.4rem 1.1rem; list-style: disc; font-size: 0.85rem; line-height: 1.6; }
		.egb-findings code { background: rgba(148, 163, 184, 0.15); border-radius: 4px; padding: 0.1rem 0.3rem; font-size: 0.8rem; }
	</style>

	<p x-show="egbError" x-text="egbError" class="text-rose-600 dark:text-rose-400 text-sm mb-4"></p>

	<template x-if="!egbTiersLoaded || egbTiers.length === 0">
		<section class="bg-white dark:bg-slate-900 rounded-2xl border border-gray-200 dark:border-slate-800 shadow-sm p-5 transition-all duration-300">
			<div class="py-16 text-center">
				<div class="w-12 h-12 bg-gray-50 dark:bg-slate-800 rounded-full flex items-center justify-center mb-3 mx-auto">
					<i data-lucide="box" class="w-6 h-6 text-gray-300 dark:text-slate-600"></i>
				</div>
				<p class="text-sm font-bold text-gray-400 dark:text-slate-500 uppercase tracking-widest">No EGB pattern results yet</p>
				<p class="text-xs text-gray-400 dark:text-slate-500 mt-2">Run the Patterns EGB scripts (e.g. <code>run_gold_patterns_30pct.py</code>) to generate tier summaries.</p>
			</div>
		</section>
	</template>

	<template x-if="egbTiersLoaded && egbTiers.length > 0">
		<div>
			<!-- Tier selector -->
			<section class="bg-white dark:bg-slate-900 rounded-2xl border border-gray-200 dark:border-slate-800 shadow-sm p-5 mb-5 transition-all duration-300">
				<div class="flex items-center gap-3 mb-4">
					<div class="w-8 h-8 bg-indigo-50 dark:bg-indigo-500/10 rounded-lg flex items-center justify-center text-indigo-600 dark:text-indigo-400">
						<i data-lucide="box" class="w-4 h-4"></i>
					</div>
					<span class="text-[15px] font-bold text-gray-900 dark:text-white">EGB GlassBox — Enrichment Tier Comparison</span>
				</div>
				<p class="text-xs text-gray-500 dark:text-slate-500 mb-4 leading-relaxed">
					Each tier adds more macro factors to the same target (gold's daily return) and re-runs an
					explainable gradient-boosted model (XGBoost + SHAP) to see how much of the move can actually
					be explained, and by which factor. Pick a tier to see its results and findings write-up.
				</p>
				<div class="flex flex-wrap gap-2">
					<template x-for="t in egbTiers" :key="t.tier">
						<button
							@click="selectEgbTier(t.tier)"
							class="px-4 py-2 rounded-xl text-sm font-semibold transition-colors border"
							:class="egbActiveTier === t.tier
								? 'bg-indigo-600 border-indigo-600 text-white'
								: 'bg-gray-50 dark:bg-slate-800 border-gray-200 dark:border-slate-700 text-gray-600 dark:text-slate-300 hover:border-indigo-400'"
						>
							<span x-text="t.tier"></span>
							<span class="opacity-75" x-text="' · R² ' + t.r2.toFixed(3)"></span>
						</button>
					</template>
				</div>
			</section>

			<!-- Full-width multi-factor comparison chart (ticker-tape style) -->
			<section class="bg-white dark:bg-slate-900 rounded-2xl border border-gray-200 dark:border-slate-800 shadow-sm p-5 mb-5 transition-all duration-300">
				<div class="flex flex-wrap items-center gap-3 mb-4">
					<div class="w-8 h-8 bg-amber-50 dark:bg-amber-500/10 rounded-lg flex items-center justify-center text-amber-600 dark:text-amber-400">
						<i data-lucide="trending-up" class="w-4 h-4"></i>
					</div>
					<span class="text-[15px] font-bold text-gray-900 dark:text-white flex-1">Factor Comparison — Gold vs. Oil, Fed Rate, Real Yield, Dollar Index</span>
					<div class="flex gap-1.5">
						<template x-for="p in ['1W', '1M', '6M', '1Y', '5Y', '10Y']" :key="p">
							<button
								@click="setEgbComparePeriod(p)"
								class="px-3 py-1.5 rounded-lg text-xs font-bold transition-colors"
								:class="egbComparePeriod === p
									? 'bg-indigo-600 text-white'
									: 'bg-gray-100 dark:bg-slate-800 text-gray-500 dark:text-slate-400 hover:bg-gray-200 dark:hover:bg-slate-700'"
								x-text="p"
							></button>
						</template>
					</div>
				</div>
				<p class="text-[11px] text-gray-400 dark:text-slate-500 mb-3">
					Every series is rebased to % change from the start of the selected period, so gold's dollar
					price, oil's dollar price, the Fed rate's percentage points, and the dollar index's level are
					all visually comparable on one chart.
				</p>
				<p x-show="egbCompareError" x-text="egbCompareError" class="text-rose-600 dark:text-rose-400 text-sm mb-3"></p>
				<div class="h-96 relative" style="height: 26rem;">
					<div x-show="egbCompareLoading" class="absolute inset-0 flex items-center justify-center text-sm text-gray-400 dark:text-slate-500">Loading…</div>
					<canvas x-ref="egbCompareChart"></canvas>
				</div>
			</section>

			<template x-if="egbActiveTierData()">
				<div>
					<!-- KPI tiles -->
					<div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-5">
						{{ ui.stat_tile("Out-of-Sample R²", "egbActiveTierData().r2.toFixed(4)", "activity", "from-indigo-600 to-blue-600") }}
						{{ ui.stat_tile("Train / Test Days", "egbActiveTierData().n_train + ' / ' + egbActiveTierData().n_test", "bar-chart-3", "from-slate-600 to-slate-500") }}
						{{ ui.stat_tile("Factors", "egbActiveTierData().factors.length", "layers", "from-blue-600 to-indigo-600") }}
						{{ ui.stat_tile("Date Range", "egbActiveTierData().date_start.slice(0,10) + ' → ' + egbActiveTierData().date_end.slice(0,10)", "calendar", "from-slate-600 to-slate-500") }}
					</div>

					<div class="grid lg:grid-cols-2 gap-5 mb-5">
						<!-- Factor importance chart -->
						<section class="bg-white dark:bg-slate-900 rounded-2xl border border-gray-200 dark:border-slate-800 shadow-sm p-5 transition-all duration-300">
							<div class="flex items-center gap-3 mb-4">
								<div class="w-8 h-8 bg-blue-50 dark:bg-blue-500/10 rounded-lg flex items-center justify-center text-blue-600 dark:text-blue-400">
									<i data-lucide="bar-chart-2" class="w-4 h-4"></i>
								</div>
								<span class="text-[15px] font-bold text-gray-900 dark:text-white">Factor Importance (mean |SHAP|)</span>
							</div>
							<div class="h-72" style="height: 18rem;">
								<canvas x-ref="egbChart"></canvas>
							</div>
							<p class="text-[11px] text-gray-400 dark:text-slate-500 mt-3">Indigo bars = factor moves gold in the <em>opposite</em> direction; red bars = <em>same</em> direction.</p>
						</section>

						<!-- Factor table -->
						<section class="bg-white dark:bg-slate-900 rounded-2xl border border-gray-200 dark:border-slate-800 shadow-sm p-5 transition-all duration-300">
							<div class="flex items-center gap-3 mb-4">
								<div class="w-8 h-8 bg-gray-100 dark:bg-slate-800 rounded-lg flex items-center justify-center text-gray-500 dark:text-slate-400">
									<i data-lucide="table" class="w-4 h-4"></i>
								</div>
								<span class="text-[15px] font-bold text-gray-900 dark:text-white">Factor Detail</span>
							</div>
							<div class="overflow-x-auto">
								<table class="w-full text-sm">
									<thead>
										<tr class="border-b border-gray-100 dark:border-slate-800">
											<th class="text-left text-[11px] font-bold text-gray-400 dark:text-slate-500 uppercase tracking-widest pb-3 pr-4">Factor</th>
											<th class="text-left text-[11px] font-bold text-gray-400 dark:text-slate-500 uppercase tracking-widest pb-3 pr-4">SHAP Impact</th>
											<th class="text-left text-[11px] font-bold text-gray-400 dark:text-slate-500 uppercase tracking-widest pb-3 pr-4">Correlation</th>
											<th class="text-left text-[11px] font-bold text-gray-400 dark:text-slate-500 uppercase tracking-widest pb-3 pr-4">Direction</th>
										</tr>
									</thead>
									<tbody>
										<template x-for="f in egbActiveTierData().factors" :key="f.factor">
											<tr class="border-t border-gray-50 dark:border-slate-800/50">
												<td class="py-2.5 pr-4 font-semibold text-gray-900 dark:text-white" x-text="f.factor.replace(/_/g, ' ')"></td>
												<td class="py-2.5 pr-4 text-gray-600 dark:text-slate-400" x-text="f.mean_abs_shap_impact.toFixed(5)"></td>
												<td class="py-2.5 pr-4 text-gray-600 dark:text-slate-400" x-text="f.correlation"></td>
												<td class="py-2.5 pr-4">
													<span class="px-2 py-0.5 rounded-full text-xs font-semibold"
														:class="f.direction && f.direction.includes('opposite') ? 'bg-indigo-50 dark:bg-indigo-500/10 text-indigo-600 dark:text-indigo-400' : 'bg-rose-50 dark:bg-rose-500/10 text-rose-600 dark:text-rose-400'"
														x-text="f.direction"></span>
												</td>
											</tr>
										</template>
									</tbody>
								</table>
							</div>
						</section>
					</div>

					<!-- Findings write-up -->
					<section class="bg-white dark:bg-slate-900 rounded-2xl border border-gray-200 dark:border-slate-800 shadow-sm p-5 transition-all duration-300">
						<div class="flex items-center gap-3 mb-4">
							<div class="w-8 h-8 bg-emerald-50 dark:bg-emerald-500/10 rounded-lg flex items-center justify-center text-emerald-600 dark:text-emerald-400">
								<i data-lucide="file-text" class="w-4 h-4"></i>
							</div>
							<span class="text-[15px] font-bold text-gray-900 dark:text-white">Findings — <span x-text="egbActiveTier"></span></span>
						</div>
						<p x-show="egbFindingsError" x-text="egbFindingsError" class="text-rose-600 dark:text-rose-400 text-sm"></p>
						<div class="egb-findings text-gray-700 dark:text-slate-300" x-html="renderMarkdown(egbFindings)"></div>
					</section>
				</div>
			</template>
		</div>
	</template>
</div>
