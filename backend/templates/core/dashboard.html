<!doctype html>
<html lang="en" x-data="dashboard()" x-init="init()" :class="{ dark: isDark }">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="icon" type="image/jpeg" href="/static/image/altair.jpg" />
	<title>ALTAIR — Dashboard</title>
	<script>
		// Set the theme before first paint (avoids a flash of the wrong theme).
		// Alpine's own isDark state (initialized the same way, in dashboard())
		// takes over for reactive toggling once it loads.
		(function () {
			if (localStorage.getItem("altair-theme") === "light") {
				document.documentElement.classList.remove("dark");
			} else {
				document.documentElement.classList.add("dark");
			}
		})();
	</script>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
	<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
	<script src="https://cdn.tailwindcss.com"></script>
	<script>
		tailwind.config = {
			darkMode: "class",
			theme: { extend: { fontFamily: { sans: ["Inter", "sans-serif"] } } },
		};
	</script>
	<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
	<style>
		[x-cloak] { display: none !important; }
		body { font-family: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif; }

		*::-webkit-scrollbar { width: 10px !important; height: 10px !important; }
		*::-webkit-scrollbar-track { background: #0f172a !important; }
		*::-webkit-scrollbar-thumb { background: #ffffff !important; border-radius: 100px !important; border: 3px solid #0f172a !important; }
		*::-webkit-scrollbar-thumb:hover { background: #e2e8f0 !important; }
		html, body, main { scrollbar-width: thin; scrollbar-color: #ffffff #0f172a; }

		/* Overview tab's daily-movers ribbon (Tickertape-style marquee).
		   Content is rendered twice back-to-back (see _overview.html) and
		   scrolled exactly -50% so the loop is seamless with no visible jump. */
		.marquee-track { width: max-content; }
		.animate-marquee { animation: altair-marquee 90s linear infinite; }
		.animate-marquee:hover { animation-play-state: paused; }
		@keyframes altair-marquee {
			from { transform: translateX(0); }
			to { transform: translateX(-50%); }
		}
	</style>
</head>
<body class="bg-gray-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 h-screen flex overflow-hidden">

	{% include "core/_sidebar.html" %}

	<div class="flex-1 flex flex-col min-w-0">
		{% include "core/_header.html" %}

		<main class="flex-1 overflow-y-auto p-6">
			<p x-show="loadError" x-text="loadError" class="text-rose-600 dark:text-rose-400 text-sm mb-4"></p>
			<p x-show="auditMessage" x-text="auditMessage" class="text-gray-500 dark:text-slate-500 text-xs mb-4"></p>

			<!-- Daily movers ribbon: Overview-only, sits where "No audit run
			     yet" appears above, ahead of the KPI stat tiles. -->
			<section
				x-show="activeTab === 'overview'"
				x-init="loadMovers()"
				class="bg-white dark:bg-slate-900 rounded-2xl border border-gray-200 dark:border-slate-800 shadow-sm py-3 mb-5 transition-all duration-300 overflow-hidden"
			>
				<div class="marquee-track flex items-center gap-8" :class="moversLoading || !moversRow.length ? '' : 'animate-marquee'">
					<template x-if="moversLoading">
						<span class="text-xs text-gray-400 dark:text-slate-500 px-5 whitespace-nowrap">Loading today's movers…</span>
					</template>
					<template x-if="!moversLoading && moversError">
						<span class="text-xs text-rose-500 dark:text-rose-400 px-5 whitespace-nowrap" x-text="moversError"></span>
					</template>
					<!-- Rendered twice back-to-back so the marquee loops seamlessly -->
					<template x-for="pass in (moversRow.length ? [1, 2] : [])" :key="pass">
						<div class="flex items-center gap-8 shrink-0">
							<template x-for="row in moversRow" :key="pass + '-' + row.market + '-' + row.ticker + '-' + row.kind">
								<div class="flex items-center gap-2 whitespace-nowrap px-2">
									<span class="text-[10px] font-bold uppercase tracking-widest text-gray-400 dark:text-slate-500" x-text="row.market"></span>
									<span class="text-sm font-bold text-gray-900 dark:text-white" x-text="row.ticker"></span>
									<span class="text-sm text-gray-500 dark:text-slate-400" x-text="'₹'.concat(fmt(row.last_price, 2))" x-show="row.market === 'IND'"></span>
									<span class="text-sm text-gray-500 dark:text-slate-400" x-text="'$'.concat(fmt(row.last_price, 2))" x-show="row.market === 'US'"></span>
									<span
										class="text-sm font-bold inline-flex items-center gap-0.5"
										:class="row.change_pct >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'"
									>
										<i :data-lucide="row.change_pct >= 0 ? 'arrow-up' : 'arrow-down'" class="w-3 h-3"></i>
										<span x-text="fmt(Math.abs(row.change_pct), 2) + '%'"></span>
									</span>
								</div>
							</template>
						</div>
					</template>
				</div>
			</section>

			<template x-if="activeTab === 'overview'">
				{% include "core/_overview.html" %}
			</template>

			<template x-if="activeTab === 'strikes'">
				{% include "core/_strikes.html" %}
			</template>

			<template x-if="activeTab === 'analytics'">
				{% include "core/_analytics.html" %}
			</template>

			<template x-if="activeTab === 'details'">
				{% include "core/_details.html" %}
			</template>

			<template x-if="activeTab === 'swing'">
				{% include "core/_swing.html" %}
			</template>

			<template x-if="activeTab === 'astro_scanner'">
				{% include "core/_astro_scanner.html" %}
			</template>

			<template x-if="activeTab === 'egb'">
				{% include "core/_egb.html" %}
			</template>

			<template x-if="activeTab === 'archive'">
				{% include "core/_archive.html" %}
			</template>

			<template x-if="activeTab === 'guide'">
				{% include "core/_guide.html" %}
			</template>
		</main>
	</div>

	<!-- Detail slide-over -->
	<div
		x-cloak
		x-show="detailTicker"
		x-transition
		class="fixed inset-y-0 right-0 w-full sm:w-96 bg-white dark:bg-slate-900 border-l border-gray-200 dark:border-slate-800 p-6 overflow-y-auto z-40 shadow-2xl"
	>
		<button @click="closeDetail()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 dark:hover:text-white text-xl leading-none">&times;</button>
		<h3 class="font-black text-lg mb-4 text-gray-900 dark:text-white" x-text="detailTicker"></h3>
		<template x-for="[k, v] in detailEntries()" :key="k">
			<div class="flex justify-between gap-4 py-2 border-b border-gray-100 dark:border-slate-800 text-sm">
				<span class="text-gray-500 dark:text-slate-500" x-text="k"></span>
				<span class="text-right break-words text-gray-900 dark:text-white" x-text="v"></span>
			</div>
		</template>
		<p x-show="detailFallback" class="text-gray-500 dark:text-slate-500 text-xs mt-3">
			Deep forensic breakdown (/forensic-ticker) unavailable — showing strike-list row only. See project README, "Known backend issue".
		</p>
	</div>

	<script>
		function dashboard() {
			return {
				isDark: localStorage.getItem("altair-theme") !== "light",
				health: { online: false, engine: "", data_ready: false },
				market: "",
				rows: [],
				topRows: [],
				loadError: "",
				search: "",
				sortKey: "astra_strike_score",
				sortDesc: true,
				activeTab: "overview",
				auditStatus: { in_progress: false, last_run: null },
				auditMessage: "",
				auditPollHandle: null,
				detailTicker: null,
				detail: {},
				detailFallback: false,
				charts: { top: null, sector: null },
				niftyChart: null,
				nasdaqChart: null,
				niftyPeriod: "6mo",
				nasdaqPeriod: "6mo",
				_niftyCandles: [],
				_nasdaqCandles: [],
				moversRow: [],
				moversLoading: false,
				moversError: "",
				moversLoaded: false,
				archiveFiles: [],
				archiveFilesLoaded: false,
				archiveFilename: "",
				archiveColumns: [],
				archiveRows: [],
				archiveError: "",
				universe: {},
				universeLoaded: false,
				egbTiers: [],
				egbTiersLoaded: false,
				egbError: "",
				egbActiveTier: null,
				egbFindings: "",
				egbFindingsError: "",
				egbChart: null,
				egbCompareChart: null,
				egbComparePeriod: "1Y",
				egbCompareSeries: [],
				egbCompareLabels: [],
				egbCompareLoading: false,
				egbCompareError: "",
				rMarket: "US",
				rSector: "",
				rSubSector: "",
				rTicker: "",
				rankerRows: [],
				rankerLoading: false,
				rankerLoadingMessage: "",
				_rankerLoadingInterval: null,
				rankerError: "",
				rankerRan: false,
				sMarket: "US",
				sSector: "",
				sSubSector: "",
				sTicker: "",
				swingRows: [],
				swingLoading: false,
				swingLoadingMessage: "",
				_swingLoadingInterval: null,
				swingError: "",
				swingRan: false,
				detailsTicker: "",
				detailsContext: { market: null, sector: null, sub_sector: null },
				detailsData: null,
				detailsLoading: false,
				detailsError: "",
				detailsPeriod: "1y",
				detailsCandles: [],
				detailsHistoryLoading: false,
				detailsHistoryError: "",
				detailsChart: null,
				detailsHoverPoint: null,
				columns: [
					{ key: "ticker", label: "Ticker" },
					{ key: "market", label: "Market" },
					{ key: "sector", label: "Sector" },
					{ key: "sub_sector", label: "Sub-Sector" },
					{ key: "pe_ratio", label: "P/E" },
					{ key: "z_score", label: "Z-Score" },
					{ key: "f_score", label: "F-Score" },
					{ key: "bailout_probability", label: "Bailout %" },
					{ key: "astra_strike_score", label: "Strike Score" },
				],

				async init() {
					await this.checkHealth();
					await this.loadData();
					await this.pollAudit();
					this.loadIndexHistory("nifty", this.niftyPeriod);
					this.loadIndexHistory("nasdaq", this.nasdaqPeriod);
					this.$nextTick(() => this.refreshIcons());
				},

				refreshIcons() {
					if (typeof lucide !== "undefined") lucide.createIcons();
				},

				tabTitle() {
					return {
						overview: "Overview",
						strikes: "Strike List",
						analytics: "Analytics",
						swing: "Swing Scanner",
						astro_scanner: "Astro Scanner",
						details: "Details",
						egb: "EGB GlassBox",
						archive: "Past Analysis",
						guide: "Guide",
					}[this.activeTab] ?? "Dashboard";
				},

				toggleTheme() {
					this.isDark = !this.isDark;
					localStorage.setItem("altair-theme", this.isDark ? "dark" : "light");
					// Chart colors are baked in at creation time — re-render with the
					// new palette. this.charts.X is null unless the Overview tab is
					// currently mounted, so this is a no-op on other tabs.
					this.$nextTick(() => {
						if (this.charts.top) this.renderTopChart(this.charts.top.canvas);
						if (this.charts.sector) this.renderSectorChart(this.charts.sector.canvas);
						if (this.detailsChart) this.renderDetailsChart();
						if (this.niftyChart) this.renderIndexChart("nifty", this._niftyCandles);
						if (this.nasdaqChart) this.renderIndexChart("nasdaq", this._nasdaqCandles);
					});
				},

				fmt(n, digits = 2) {
					return typeof n === "number" && !Number.isNaN(n) ? n.toFixed(digits) : "—";
				},

				fmtArchiveValue(v) {
					if (v === null || v === undefined || v === "") return "—";
					if (typeof v === "number") {
						return Number.isInteger(v) ? v : Math.round(v * 10000) / 10000;
					}
					return v;
				},

				healthLabel() {
					if (!this.health.online) return "backend unreachable";
					return `${this.health.engine} · ${this.health.data_ready ? "data ready" : "no strike data yet"}`;
				},

				async checkHealth() {
					try {
						const res = await fetch("/api/v1/health");
						if (!res.ok) throw new Error();
						const data = await res.json();
						this.health = { online: true, ...data };
					} catch {
						this.health = { online: false, engine: "", data_ready: false };
					}
				},

				async loadData() {
					const q = this.market ? `?market=${encodeURIComponent(this.market)}` : "";
					try {
						const [listRes, topRes] = await Promise.all([
							fetch(`/api/v1/strike-list${q}`),
							fetch(`/api/v1/top-targets/5${q}`),
						]);
						if (!listRes.ok) throw new Error(`${listRes.status} ${listRes.statusText}`);
						if (!topRes.ok) throw new Error(`${topRes.status} ${topRes.statusText}`);
						this.rows = await listRes.json();
						this.topRows = await topRes.json();
						this.loadError = "";
					} catch (err) {
						this.rows = [];
						this.topRows = [];
						this.loadError = `Could not load strike data: ${err.message}`;
					}
					// Chart re-rendering is handled by the $watch('rows', ...) set up
					// in each canvas's x-init (see core/_overview.html) — not here —
					// so there's exactly one trigger per data change, not two racing.
					this.$nextTick(() => this.refreshIcons());
				},

				// --- KPI stat tiles ---
				totalTickers() {
					return this.rows.length;
				},
				avgStrikeScore() {
					if (this.rows.length === 0) return "—";
					const avg = this.rows.reduce((sum, r) => sum + (r.astra_strike_score || 0), 0) / this.rows.length;
					return avg.toFixed(1);
				},
				highRiskCount() {
					return this.rows.filter((r) => (r.astra_strike_score || 0) >= 80).length;
				},

				// --- Charts (single-hue magnitude bars; table below carries exact values) ---
				chartColors() {
					return this.isDark
						? { grid: "#1e293b", ticks: "#94a3b8", labels: "#e2e8f0", bar: "#f87171" }
						: { grid: "#e2e8f0", ticks: "#64748b", labels: "#1e293b", bar: "#dc2626" };
				},

				renderTopChart(canvas) {
					if (this.charts.top) this.charts.top.destroy();
					const c = this.chartColors();
					const top10 = [...this.rows].sort((a, b) => b.astra_strike_score - a.astra_strike_score).slice(0, 10);
					this.charts.top = new Chart(canvas, {
						type: "bar",
						data: {
							labels: top10.map((r) => r.ticker),
							datasets: [
								{
									data: top10.map((r) => r.astra_strike_score),
									backgroundColor: c.bar,
									borderRadius: 4,
									maxBarThickness: 20,
								},
							],
						},
						options: {
							indexAxis: "y",
							responsive: true,
							maintainAspectRatio: false,
							animation: false,
							resizeDelay: 100,
							plugins: {
								legend: { display: false },
								tooltip: { callbacks: { label: (ctx) => ` Strike score: ${ctx.parsed.x.toFixed(2)}` } },
							},
							scales: {
								x: { grid: { color: c.grid }, ticks: { color: c.ticks }, beginAtZero: true },
								y: { grid: { display: false }, ticks: { color: c.labels } },
							},
						},
					});
				},

				renderSectorChart(canvas) {
					if (this.charts.sector) this.charts.sector.destroy();
					const c = this.chartColors();
					const bySector = {};
					for (const r of this.rows) {
						const key = r.sector || "Unknown";
						if (!bySector[key]) bySector[key] = [];
						bySector[key].push(r.astra_strike_score || 0);
					}
					const sectors = Object.keys(bySector).sort(
						(a, b) => avg(bySector[b]) - avg(bySector[a])
					);
					function avg(arr) {
						return arr.reduce((s, v) => s + v, 0) / arr.length;
					}
					this.charts.sector = new Chart(canvas, {
						type: "bar",
						data: {
							labels: sectors.map((s) => s.replace(/_/g, " ")),
							datasets: [
								{
									data: sectors.map((s) => avg(bySector[s])),
									backgroundColor: c.bar,
									borderRadius: 4,
									maxBarThickness: 20,
								},
							],
						},
						options: {
							indexAxis: "y",
							responsive: true,
							maintainAspectRatio: false,
							animation: false,
							resizeDelay: 100,
							plugins: {
								legend: { display: false },
								tooltip: { callbacks: { label: (ctx) => ` Avg strike score: ${ctx.parsed.x.toFixed(2)}` } },
							},
							scales: {
								x: { grid: { color: c.grid }, ticks: { color: c.ticks }, beginAtZero: true },
								y: { grid: { display: false }, ticks: { color: c.labels } },
							},
						},
					});
				},

				// --- Overview tab: Nifty/Nasdaq index charts ---
				async loadIndexHistory(indexName, period, force = false) {
					if (indexName === "nifty") this.niftyPeriod = period;
					if (indexName === "nasdaq") this.nasdaqPeriod = period;
					try {
						// Cached per (index, period) per calendar day on the backend -
						// force=true (from the header's refresh button) bypasses that
						// and rescans live. Plain tab/range-button clicks never force.
						const res = await fetch(`/api/v1/market/index/${indexName}?period=${period}${force ? "&force=true" : ""}`);
						if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
						const data = await res.json();
						const candles = data.candles ?? [];
						if (indexName === "nifty") this._niftyCandles = candles;
						if (indexName === "nasdaq") this._nasdaqCandles = candles;
						this.renderIndexChart(indexName, candles);
					} catch {
						// Index chart failure is non-critical to the rest of Overview -
						// fail silently rather than surfacing a whole-page error for a
						// context widget.
					}
				},

				renderIndexChart(indexName, candles) {
					const canvasRef = indexName === "nifty" ? this.$refs.niftyChart : this.$refs.nasdaqChart;
					if (!canvasRef) return;
					const chartKey = indexName === "nifty" ? "niftyChart" : "nasdaqChart";
					if (this[chartKey]) {
						this[chartKey].destroy();
						this[chartKey] = null;
					}
					if (!candles.length) return;

					const c = this.chartColors();
					const isUp = candles.length > 1 && candles[candles.length - 1].close >= candles[0].close;
					const lineColor = isUp ? (this.isDark ? "#34d399" : "#059669") : c.bar;

					this[chartKey] = new Chart(canvasRef, {
						type: "line",
						data: {
							labels: candles.map((row) => row.date),
							datasets: [
								{
									data: candles.map((row) => row.close),
									borderColor: lineColor,
									backgroundColor: "transparent",
									borderWidth: 1.5,
									pointRadius: 0,
									tension: 0.15,
								},
							],
						},
						options: {
							responsive: true,
							maintainAspectRatio: false,
							animation: false,
							resizeDelay: 100,
							plugins: {
								legend: { display: false },
								tooltip: { callbacks: { label: (ctx) => ` Close: ${ctx.parsed.y.toFixed(2)}` } },
							},
							scales: {
								x: { grid: { display: false }, ticks: { color: c.ticks, maxTicksLimit: 8 } },
								y: { grid: { color: c.grid }, ticks: { color: c.ticks } },
							},
						},
					});
				},

				// --- Overview tab: daily movers ribbon ---
				async loadMovers(force = false) {
					// moversLoaded guards against re-fetching on every tab
					// revisit within the same page load - force=true (from the
					// header refresh button) explicitly overrides that guard,
					// since the whole point of forcing is to get a fresh scan
					// even though one already loaded this session.
					if (this.moversLoaded && !force) return;
					this.moversLoaded = true;
					this.moversLoading = true;
					this.moversError = "";
					try {
						// Cached once per calendar day on the backend (see
						// MarketRoutes.py) - force=true bypasses that and
						// rescans all 40 headline tickers live.
						const res = await fetch(`/api/v1/market/movers${force ? "?force=true" : ""}`);
						if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
						const data = await res.json();
						const combined = [];
						for (const market of Object.keys(data)) {
							for (const row of data[market].gainers ?? []) combined.push({ ...row, kind: "gainer" });
							for (const row of data[market].losers ?? []) combined.push({ ...row, kind: "loser" });
						}
						this.moversRow = combined;
					} catch (err) {
						this.moversRow = [];
						this.moversError = `Could not load today's movers: ${err.message}`;
					}
					this.moversLoading = false;
					this.$nextTick(() => this.refreshIcons());
				},

				// Called by the header's refresh button, only when the Overview
				// tab is active - force-rescans movers and both index charts,
				// bypassing the daily cache (a plain tab visit never does this).
				refreshOverviewMarketData() {
					this.loadMovers(true);
					this.loadIndexHistory("nifty", this.niftyPeriod, true);
					this.loadIndexHistory("nasdaq", this.nasdaqPeriod, true);
				},

				sortedRows() {
					const key = this.sortKey;
					const desc = this.sortDesc;
					const needle = this.search.trim().toLowerCase();
					const base = needle
						? this.rows.filter((r) => (r.ticker ?? "").toLowerCase().includes(needle))
						: this.rows;
					return [...base].sort((a, b) => {
						const av = a[key];
						const bv = b[key];
						if (typeof av === "number" && typeof bv === "number") {
							return desc ? bv - av : av - bv;
						}
						return desc ? String(bv).localeCompare(String(av)) : String(av).localeCompare(String(bv));
					});
				},

				setTab(tab) {
					if (this.activeTab === "overview" && tab !== "overview") {
						// Destroy chart instances before Alpine's x-if removes their
						// canvases from the DOM, or Chart.js throws trying to touch
						// the now-detached element on its next internal tick.
						this.destroyCharts();
					}
					if (this.activeTab === "egb" && tab !== "egb") {
						if (this.egbChart) { this.egbChart.destroy(); this.egbChart = null; }

						if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);

				async loadDetailsHistory(period) {
					if (!this.detailsTicker) return;

					this.detailsHistoryLoading = true;
					this.detailsHistoryError = "";
					try {
						const res = await fetch(`/api/v1/ticker/${encodeURIComponent(this.detailsTicker)}/history?period=${period}`);
						if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
						const data = await res.json();
						this.detailsCandles = data.candles ?? [];
						this.$nextTick(() => this.renderDetailsChart());
					} catch (err) {
						this.detailsCandles = [];

					this.detailsHistoryLoading = false;
				},

				detailsRangeStats() {
					if (!this.detailsCandles.length) return { high: null, low: null, returnsPct: 0 };
					const closes = this.detailsCandles.map((row) => row.close);
					const highs = this.detailsCandles.map((row) => row.high);
					const lows = this.detailsCandles.map((row) => row.low);
					const first = closes[0];
					const last = closes[closes.length - 1];
					return {
						high: Math.max(...highs),
						low: Math.min(...lows),
						returnsPct: first ? ((last - first) / first) * 100 : 0,
					};
				},

				// Tickertape-style vertical crosshair: draws a dashed line + dot at
				// the hovered index, driven entirely by Chart.js's own afterDraw
				// hook rather than a second overlaid canvas.
				_detailsCrosshairPlugin() {
					const self = this;
					return {
						id: "detailsCrosshair",
						afterDraw(chart) {
							const idx = self._detailsHoverIndex;
							if (idx === null || idx === undefined) return;
							const { ctx, chartArea, scales } = chart;
							const x = scales.x.getPixelForValue(idx);
							const meta = chart.getDatasetMeta(0);
							const point = meta.data[idx];
							if (!point) return;

							ctx.save();
							ctx.beginPath();
							ctx.setLineDash([4, 4]);
							ctx.strokeStyle = self.isDark ? "#475569" : "#cbd5e1";
							ctx.lineWidth = 1;
							ctx.moveTo(x, chartArea.top);
							ctx.lineTo(x, chartArea.bottom);
							ctx.stroke();

							ctx.setLineDash([]);
							ctx.beginPath();
							ctx.arc(point.x, point.y, 4, 0, Math.PI * 2);
							ctx.fillStyle = self.chartColors().bar;
							ctx.fill();
							ctx.strokeStyle = self.isDark ? "#0f172a" : "#ffffff";
							ctx.lineWidth = 2;
							ctx.stroke();
							ctx.restore();
						},
					};
				},

				renderDetailsChart() {
					const canvas = document.getElementById("detailsChartCanvas");
					if (!canvas) return;
					if (this.detailsChart) {
						this.detailsChart.destroy();
						this.detailsChart = null;
					}
					if (!this.detailsCandles.length) return;

					const c = this.chartColors();
					const isUp = this.detailsRangeStats().returnsPct >= 0;
					const lineColor = isUp ? (this.isDark ? "#34d399" : "#059669") : c.bar;

					this._detailsHoverIndex = null;
					this.detailsHoverPoint = null;

					this.detailsChart = new Chart(canvas, {
						type: "line",
						data: {
							labels: this.detailsCandles.map((row) => row.date),
							datasets: [
								{
									data: this.detailsCandles.map((row) => row.close),
									borderColor: lineColor,
									backgroundColor: (ctx) => {
										const { chartArea, ctx: canvasCtx } = ctx.chart;
										if (!chartArea) return "transparent";
										const gradient = canvasCtx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
										gradient.addColorStop(0, isUp ? "rgba(5,150,105,0.25)" : "rgba(220,38,38,0.2)");
										gradient.addColorStop(1, isUp ? "rgba(5,150,105,0)" : "rgba(220,38,38,0)");
										return gradient;
									},
									borderWidth: 1.75,
									pointRadius: 0,
									pointHoverRadius: 0,
									tension: 0.15,
									fill: true,
								},
							],
						},
						options: {
							responsive: true,
							maintainAspectRatio: false,
							animation: false,
							resizeDelay: 100,
							interaction: { mode: "index", intersect: false },
							plugins: {
								legend: { display: false },
								tooltip: { enabled: false },
							},
							scales: {
								x: { grid: { display: false }, ticks: { color: c.ticks, maxTicksLimit: 8 } },
								y: { grid: { color: c.grid }, ticks: { color: c.ticks } },
							},
							onHover: (event, elements, chart) => {
								if (!elements.length) {
									this._detailsHoverIndex = null;
									this.detailsHoverPoint = null;
									chart.draw();
									return;
								}
								const idx = elements[0].index;
								this._detailsHoverIndex = idx;
								const row = this.detailsCandles[idx];
								const point = chart.getDatasetMeta(0).data[idx];
								this.detailsHoverPoint = { x: point.x, date: row.date, close: row.close };
								chart.draw();
							},
						},
						plugins: [this._detailsCrosshairPlugin()],
					});

					canvas.addEventListener("mouseleave", () => {
						this._detailsHoverIndex = null;
						this.detailsHoverPoint = null;
						if (this.detailsChart) this.detailsChart.draw();
					});
				},

				detailsVerdictClass(verdict) {
					if (verdict === "LONG SETUP") return "bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-400";
					if (verdict === "SHORT SETUP") return "bg-rose-50 dark:bg-rose-500/10 text-rose-600 dark:text-rose-400";
					return "bg-gray-50 dark:bg-slate-800 text-gray-500 dark:text-slate-400";
				},

				fundamentalEntries() {
					const f = this.detailsData?.fundamental ?? {};
					// The 7 generic-formula-only fields are None (not "unavailable")
					// whenever a sector-specific scorer (Banking/Energy/IT) ran
					// instead - see VulnerabilityRanker.py's scoring_model field.
					// Showing them as "—" here would look like a data failure, so
					// they're hidden entirely rather than displayed as blank.
					const genericOnlyFields = ["z_score", "leverage_ratio", "sloan_ratio", "roic", "m_score", "f_score", "short_float"];
					const isSectorSpecific = f.scoring_model && f.scoring_model !== "generic";
					return Object.entries(f).filter(([k]) => {
						if (["astra_strike_score", "avs_score", "scoring_model"].includes(k)) return false;
						if (isSectorSpecific && genericOnlyFields.includes(k)) return false;
						return true;
					});
				},

				async selectEgbTier(tier) {

						const res = await fetch(`/api/v1/egb/findings/${encodeURIComponent(tier)}`);

				egbActiveTierData() {
					return this.egbTiers.find((t) => t.tier === this.egbActiveTier) ?? null;

				renderEgbChart() {
					const tierData = this.egbActiveTierData();
					if (!tierData || !this.$refs.egbChart) return;
					if (this.egbChart) this.egbChart.destroy();

					const c = this.chartColors();
					const factors = [...tierData.factors].sort((a, b) => b.mean_abs_shap_impact - a.mean_abs_shap_impact);

					this.egbChart = new Chart(this.$refs.egbChart, {
						type: "bar",
						data: {
							labels: factors.map((f) => f.factor.replace(/_/g, " ")),
							datasets: [{
								data: factors.map((f) => f.mean_abs_shap_impact),
								backgroundColor: factors.map((f) => (f.correlation >= 0 ? c.bar : "#6366f1")),
								borderRadius: 4,
								maxBarThickness: 24,
							}],
						},
						options: {
							indexAxis: "y",
							responsive: true,
							maintainAspectRatio: false,
							animation: false,
							resizeDelay: 100,
							plugins: {
								legend: { display: false },
								tooltip: {
									callbacks: {
										label: (ctx) => {
											const f = factors[ctx.dataIndex];
											return ` SHAP impact: ${f.mean_abs_shap_impact.toFixed(5)} (corr ${f.correlation})`;
										},
									},
								},
							},
							scales: {
								x: { grid: { color: c.grid }, ticks: { color: c.ticks }, beginAtZero: true },
								y: { grid: { display: false }, ticks: { color: c.labels } },
							},
						},
					});
				},

				renderMarkdown(md) {
					// Minimal, dependency-free markdown rendering — just enough for
					// these findings docs (headings, bold, tables, lists), not a
					// general-purpose parser.
					if (!md) return "";
					const lines = md.split("\n");
					let html = "";
					let inTable = false;
					let inList = false;
					for (const line of lines) {
						if (/^\|.*\|$/.test(line.trim())) {
							if (!inTable) { html += "<table class=\"egb-md-table\">"; inTable = true; }
							if (/^\|[\s-:|]+\|$/.test(line.trim())) continue;
							const cells = line.trim().slice(1, -1).split("|").map((c) => c.trim());
							html += "<tr>" + cells.map((c) => `<td>${c}</td>`).join("") + "</tr>";
							continue;
						} else if (inTable) { html += "</table>"; inTable = false; }

						if (/^- /.test(line)) {
							if (!inList) { html += "<ul>"; inList = true; }
							html += `<li>${line.slice(2)}</li>`;
							continue;
						} else if (inList) { html += "</ul>"; inList = false; }

						if (line.startsWith("# ")) html += `<h2>${line.slice(2)}</h2>`;
						else if (line.startsWith("## ")) html += `<h3>${line.slice(3)}</h3>`;
						else if (line.trim() === "") html += "";
						else html += `<p>${line}</p>`;
					}
					if (inTable) html += "</table>";
					if (inList) html += "</ul>";
					return html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`(.+?)`/g, "<code>$1</code>");
				},

				setSort(key) {
					if (this.sortKey === key) {
						this.sortDesc = !this.sortDesc;
					} else {
						this.sortKey = key;
						this.sortDesc = true;
					}
				},

				async runAudit() {
					this.auditStatus.in_progress = true;
					try {
						const res = await fetch("/api/v1/audit", { method: "POST" });
						const data = await res.json();
						this.auditMessage = data.message ?? "Audit triggered.";
					} catch {
						this.auditMessage = "Failed to trigger audit.";
					}
					if (!this.auditPollHandle) {
						this.auditPollHandle = setInterval(() => this.pollAudit(), 4000);
					}
				},

				async pollAudit() {
					try {
						const res = await fetch("/api/v1/status");
						this.auditStatus = await res.json();
						this.auditMessage = this.auditStatus.in_progress
							? "Audit running in background…"
							: this.auditStatus.last_run
								? `Last run: ${this.auditStatus.last_run}`
								: "No audit run yet.";
						if (!this.auditStatus.in_progress && this.auditPollHandle) {
							clearInterval(this.auditPollHandle);
							this.auditPollHandle = null;
							await this.loadData();
							await this.checkHealth();
						}
					} catch {
						// backend unreachable mid-poll; leave status as-is and try again next tick
					}
				},

				async openDetail(ticker) {
					this.detailTicker = ticker;
					const row = this.rows.find((r) => r.ticker === ticker) ?? {};
					let forensic = null;
					try {
						const res = await fetch(`/api/v1/forensic-ticker/${encodeURIComponent(ticker)}`);
						if (res.ok) forensic = await res.json();
					} catch {
						forensic = null;
					}
					this.detail = forensic ?? row;
					this.detailFallback = !forensic;
				},

				detailEntries() {
					return Object.entries(this.detail).filter(([k]) => k !== "ticker");
				},

				closeDetail() {
					this.detailTicker = null;
				},

				// --- Astro Scanner tab ---
				astroRows: [],
				astroLoading: false,
				astroError: "",
				astroLoaded: false,
				astroDetailTicker: null,
				astroDetail: {},
				astroDetailLoading: false,

				async loadAstroData(force = false) {
					if (this.astroLoaded && !force) return;
					this.astroLoading = true;
					this.astroError = "";
					try {
						const res = await fetch(`/api/v1/astro-scanner${force ? "?force=true" : ""}`);
						if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
						this.astroRows = await res.json();
						this.astroLoaded = true;
					} catch (err) {
						this.astroRows = [];
						this.astroError = `Could not load astro data: ${err.message}`;
					}
					this.astroLoading = false;
					this.$nextTick(() => this.refreshIcons());
				},

				async openAstroDetail(ticker) {
					this.astroDetailTicker = ticker;
					this.astroDetailLoading = true;
					this.astroDetail = {};
					try {
						const res = await fetch(`/api/v1/astro-scanner/detail/${encodeURIComponent(ticker)}`);
						if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
						this.astroDetail = await res.json();
					} catch (err) {
						this.astroDetail = { ticker, error: err.message };
					}
					this.astroDetailLoading = false;
					this.$nextTick(() => this.refreshIcons());
				}
			};
		}
	</script>
</body>
