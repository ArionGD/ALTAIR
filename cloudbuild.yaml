# GCP Cloud Build Configuration for ALTAIR Engine
# Note: You can customize region and repository names to match your GCP project layout.
# 
# Prerequisites:
# 1. Create an Artifact Registry Docker repository named 'altair-repo' in region 'us-central1'.
# 2. Enable Cloud Build, Cloud Run, and Artifact Registry APIs.
# 3. Give the Cloud Build service account the 'Cloud Run Admin' and 'Service Account User' roles.

steps:
  # Step 1: Build the integrated Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/altair-repo/altair-app:$COMMIT_SHA',
      '.'
    ]

  # Step 2: Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'us-central1-docker.pkg.dev/$PROJECT_ID/altair-repo/altair-app:$COMMIT_SHA'
    ]

  # Step 3: Deploy the image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args: [
      'run', 'deploy', 'altair-service',
      '--image', 'us-central1-docker.pkg.dev/$PROJECT_ID/altair-repo/altair-app:$COMMIT_SHA',
      '--region', 'us-central1',
      '--platform', 'managed',
      '--allow-unauthenticated'
    ]

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/altair-repo/altair-app:$COMMIT_SHA'
