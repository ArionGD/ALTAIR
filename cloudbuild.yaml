# GCP Cloud Build Configuration for ALTAIR Engine
# Target Region: asia-south1 (Mumbai)
# Target Artifact Registry: papertrade-repo
# (Builds and pushes the container; deployment is triggered locally to bypass service account permission locks)

steps:
  # Step 1: Build the integrated multi-stage Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/papertrade-repo/altair-app:latest',
      '.'
    ]

  # Step 2: Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'asia-south1-docker.pkg.dev/$PROJECT_ID/papertrade-repo/altair-app:latest'
    ]

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/papertrade-repo/altair-app:latest'
